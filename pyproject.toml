[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secret-manager"
version = "0.1.0"
description = "Production-grade Distributed Secrets Manager — HashiCorp Vault-inspired"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.19",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Validation / settings
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Cryptography
    # cryptography provides AES-256-GCM via hazmat primitives
    "cryptography>=43.0.0",
    # argon2-cffi wraps the reference Argon2 C implementation
    "argon2-cffi>=23.1.0",

    # JWT — python-jose[cryptography] validates aud/iss, supports RS256/HS256
    "python-jose[cryptography]>=3.3.0",

    # Cache / rate-limiting / distributed locks
    "redis[asyncio]>=5.2.0",

    # Task queue — Celery for background workers (token cleanup, key rotation)
    "celery[redis]>=5.4.0",

    # HTTP client (for integration tests & health checks)
    "httpx>=0.28.0",

    # Structured logging — never logs raw secrets
    "structlog>=24.4.0",

    # ULID for audit log event IDs (lexicographically sortable, random)
    "python-ulid>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.35.0",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "C4", "T20", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded passwords in test fixtures only
    "B008",   # FastAPI depends on function calls in defaults (Depends)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "T20"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
