# ─────────────────────────────────────────────────────────────────────────────
# SecretManager — Full stack Docker Compose
#
# Services:
#   api       — FastAPI application (4 uvicorn workers)
#   worker    — Celery worker for background tasks
#   beat      — Celery beat scheduler for periodic tasks
#   postgres  — PostgreSQL 16 database
#   redis     — Redis 7 for cache, rate limiting, locks, Celery
#   pgadmin   — PostgreSQL admin UI (dev profile only)
#
# Profiles:
#   (default) — api, worker, beat, postgres, redis
#   dev       — adds pgadmin
#   test      — adds postgres/redis with test databases
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-smgr}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-secretmanager}"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/4"
  CELERY_RESULT_BACKEND: "redis://redis:6379/5"
  APP_ENV: "${APP_ENV:-development}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  MASTER_ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY}"
  AUDIT_HMAC_KEY: "${AUDIT_HMAC_KEY}"
  ARGON2_TIME_COST: "${ARGON2_TIME_COST:-3}"
  ARGON2_MEMORY_COST: "${ARGON2_MEMORY_COST:-65536}"
  ARGON2_PARALLELISM: "${ARGON2_PARALLELISM:-4}"

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: secret-manager-api:latest
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Resource limits — prevents a single service from consuming all resources
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Celery Worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: runtime
    image: secret-manager-worker:latest
    command: celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      <<: *common-env
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Celery Beat ───────────────────────────────────────────────────────────────
  beat:
    image: secret-manager-worker:latest
    command: celery -A workers.celery_app.celery_app beat --loglevel=info
    environment:
      <<: *common-env
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - backend

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-smgr}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-devpassword}"
      POSTGRES_DB: "${POSTGRES_DB:-secretmanager}"
      # Performance tuning for secrets workload
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smgr} -d ${POSTGRES_DB:-secretmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: secret-manager-frontend:latest
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  # ── pgAdmin (dev profile only) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
